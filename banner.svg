<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" role="img" aria-label="Fayaz H. Sahito, Lab Instructor in Computer Science">
<style>
.t{fill:#141414;font-family:Georgia,'Times New Roman',serif}.m{fill:#5f5f5f;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.l{stroke:#1f4fa3;stroke-opacity:.3;stroke-width:1}.n{fill:#1f4fa3}.b{fill:#1f4fa3}
@media(prefers-color-scheme:dark){.t{fill:#ececec}.m{fill:#a3a3a3}.l,.n{stroke:#8fb4f5}.n,.b{fill:#8fb4f5}}
.w{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.bar{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);animation:grow 1.2s 1s ease forwards}
@keyframes grow{to{transform:scaleX(1)}}
.p{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
</style>
